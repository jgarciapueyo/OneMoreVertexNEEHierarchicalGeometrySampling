
# BVH ablation across several non-Disney geometries
docker:
  container: onemorevertexneehierarchicalgeometrysampling-mitsuba-1
  workdir: /home/mitsuba
  setpath_script: /home/mitsuba/setpath.sh

scene: scenes/22_wildcard_asteroids_smallerspotlight/wildcard_spotlight.xml
output_root: scenes/22_wildcard_asteroids_smallerspotlight/results/ablation_asteroids_spot_trueablation

reference:
  inherit_config_params: false
  # pre_rendered_exr: <path/to/reference.exr>
  scene: scenes/22_wildcard_asteroids_smallerspotlight/wildcard_spotlight_pathref.xml
  spp: 16000
  

spp_schedule: [2, 4, 8, 16, 32, 64, 128, 512] # , 16, 32, 64, 128, 512
repetitions_per_spp: 3
reference_spp: 16000

global_defaults:
  integrator: oneehgspath_2step
  maxDepth: 3
  bvhMaxDepth: 20
  rrDepth: 5
  leafSamplingMode: Primitive
  useBVH: true
  disableNEE: false
  doAdditionalVertex: true
  outputDebugCSV: false
  enableLightcuts: false
  lightcutThreshold: 1.5
  gaussianSAThreshold: 0.03141592
  uniformImportance: false
  specularImportance: false
  sigmaPoints: precomputed
  defensivePDF: 0.000001

analysis:
  baseline_config_name: baseline_path
  average_bbox: [0.55, 0.45, 0.65, 0.55] # delimits the area used to check unbiasedness (this box is the bottom half of the image)
  figure_format: svg
  exposure_scale: .5
  n_top_techniques: 10
  is_ablation: true

named_configs:
  - name: baseline_path
    params:
      __scene: scenes/22_wildcard_asteroids_smallerspotlight/wildcard_spotlight_pathref.xml
      integrator: path
      maxDepth: 3
      rrDepth: 5

  # - name: bdpt
  #   params:
  #     integrator: bdpt
  #     __scene: scenes/2_wildcard_asteroids/wildcard_spotlight_pathref.xml

  - name: nogaussian
    params:
      ablateGaussian: true

  - name: novmf
    params:
      ablateVMF: true
      
      
  - name: nocosinexs
    params:
      ablateBSDF: true

  - name: nocosinexe
    params:
      ablateEmission: true

  - name: nodistancexs
    params:
      ablateDistanceXs: true

  - name: nodistancexe
    params:
      ablateDistanceXe: true

  - name: noalbedo
    params:
      ablateAlbedo: true
      
  - name: allablation
    params:
      ablateGaussian: true
      ablateVMF: true
      ablateBSDF: true
      ablateEmission: true
      ablateDistanceXs: true
      ablateDistanceXe: true
      ablateAlbedo: true

  - name: ours
    params:
      ablateGaussian: false
      ablateVMF: false
      ablateBSDF: false
      ablateEmission: false
      ablateDistanceXs: false
      ablateDistanceXe: false
      ablateAlbedo: false

  