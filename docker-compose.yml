# HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose build
# docker compose run --rm mitsuba bash scripts/build_mitsuba.sh
# docker compose run --rm mitsuba bash scripts/reproduce.sh fig9 --quick
services:
  mitsuba:
    build:
      context: .
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    image: oneehgs-mitsuba
    volumes:
      # The repository: sources, scenes, build output and results
      - .:/home/mitsuba
    working_dir: /home/mitsuba
    command: bash
    stdin_open: true
    tty: true
